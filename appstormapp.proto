syntax = "proto3";

package appstorm;

// Define the gRPC service
service AppStormService {
  // RPC to generate an app
  rpc GenerateApp (GenerateAppRequest) returns (GenerateAppResponse);

  // RPC to publish NFT (placeholder)
  rpc PublishNFT (PublishNFTRequest) returns (PublishNFTResponse);
}

// Request message for GenerateApp
message GenerateAppRequest {
  string email = 1;
  string password = 2;
  string prompt = 3;
}

// Response message for GenerateApp
message GenerateAppResponse {
  bool success = 1;
  string url = 2;      // final share URL
  string error = 3;    // optional error message
}

// Request message for PublishNFT
message PublishNFTRequest {
  // Empty for now, can be extended
}

// Response message for PublishNFT
message PublishNFTResponse {
  bool success = 1;
  string message = 2;
  string data = 3;     // placeholder for future NFT data
}
